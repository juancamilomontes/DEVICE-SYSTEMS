[project]
name = "device-systems"
version = "0.1.0"
description = "API REST para la gestión de usuarios del sistema device_systems (FastAPI)."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Juan Camilo Montes", email = "jm3876602@gmail.com" }
]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic[email]>=2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

# La app NO es una librería instalable, así que no se construye como paquete.
[tool.uv]
package = false

# Permite que pytest encuentre el paquete `app` desde la raíz del proyecto.
[tool.pytest.ini_options]
pythonpath = ["."]
